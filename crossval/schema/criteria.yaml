  - T12 只要求**模型层** CI,T13b 只要求**群体层**校准斜率 CI,**没有一条要求 per-sample 不确定性**
  - Mannodi 材料 ML Figure 6A/B:不确定性 vs 绝对误差散点存在**高误差高不确定性尾部**
  - 只报平均 RMSE 是平均性能,不告诉读者**哪些样本预测不可信** —— 高风险个体误判后果更严重
  - ★实测 corr:信息性 0.892 vs 无信息 -0.031(把 corr<0.1 则无信息 从断言变为证据)
  na_when: 非预测建模研究 → N/A + 理由
  name: 预测不确定性的分层报告
  on_fail:
    action: 判不完整;声称个体风险时为硬阻断
    blocking: false
  pass_when: (a)(b) 齐全;(c) 触发时已分层;(d) 声称个体风险时有 per-sample CI 且 corr >= 0.1
  predicate: "(a) 必须报告 per-sample 预测不确定性\n    (GPR 后验方差 / bootstrap 预测分布 / MC dropout)\n\
    \n(b) 必须报告不确定性 vs 绝对误差关系(散点 + 相关系数)\n\n(c) corr > 0.3 → 必须报告分层性能:\n    低/高不确定组的\
    \ AUC、校准、Brier 分别列\n\n(d) 声称可用于个体风险预测 → 必须报告 per-sample CI,\n    禁止只报群体平均 AUC\n\
    \n不通过:只报单一平均性能 → 判不完整;\n        高风险亚群不确定性更高但未声明 → R5;\n        声称精确预测但 corr <\
    \ 0.1 → 不确定性无信息\n"
  requires_tools:
  - uncertainty_estimation
  - correlation
  stage_tag: prediction
  version: 2.20+
- decidable: auto
  id: T35
  inputs:
  - tools
  - tool_versions
  - ldsc_intercept
  - ldsc_intercept_corrected
  - mtag_vs_single_gwas_declared
  - mtag_genetic_corr_claim
  - coloc_posteriors
  - coloc_prior_declared
  - independent_validation
  invariants:
  - T32 管 MR,**不管 LDSC / MTAG / colocalization** —— 本条补此对称面
  - LDSC:样本量 <10万时遗传相关性估计不稳;群体分层校正不充分会**系统高估**
  - MTAG:**人为夸大遗传相关性**(多表型联合估计重复计算重叠样本信息)
  - ★循环论证:用 MTAG 输出声称遗传相关性高 —— 该相关性是 MTAG 联合估计**定义**出来的
  - ROMO1(Wang 2025)实测中招:用 LDSC + MTAG 但未报 intercept / 未声明 MTAG 不可比
  na_when: 未使用多组学整合工具 → N/A + 理由;coloc H4>0.8 但先验未声明 → 判不了
  name: 多组学整合工具的已知偏倚(LDSC/MTAG/coloc)
  on_fail:
    action: R5 回退;循环论证为硬阻断
    blocking: false
  pass_when: (a) 已声明;LDSC intercept 接近 1 或已校正;MTAG 已声明不可比;coloc 先验已声明;(e) 有独立验证
  predicate: "(a) 每个工具必须声明版本与关键参数\n\n(b) LDSC:必须报告 intercept;偏离 1 说明混杂校正不足(>0.1 须校正)\n\
    \n(c) MTAG:必须声明其结果与单个 GWAS 不可直接比较;\n    用其输出声称遗传相关性 = 循环论证\n\n(d) colocalization:必须报告\
    \ H1/H2/H3/H4 后验与先验设置\n\n(e) 任何工具结果须有独立数据验证,不能只凭工具输出断言因果\n"
  requires_tools:
  - ldsc
  - mtag
  - coloc
  stage_tag: multiomics
  trigger: 使用 LDSC / MTAG / colocalization / SuSiE
  version: 2.20+
- decidable: auto
  id: T36
  name: 多组件整合的增量消融
  note: |
    ★ 与 T31 分工,禁止合并:T31 静态判"特征集内部冗余"(看相关系数);
    T36 动态判"组件之间增益"(看 ΔAUC/ΔC-index)。
    锚定文献:ROMO1(Wang 2025)/p53(Wang)/Lage-Rupprecht —— 三篇均
    声称"整合有用"但**未做消融**。
  on_fail: 硬阻断(与 T13 同规)
  na_when: 单组件研究(未做多组学/多算法/多特征集整合)
  predicate: |
    reported(perf_full) and reported(perf_single, every component)
    and reported(perf_loo, every component)
    and for each c: delta_c = perf_full - perf_loo[c]
    delta_c >= 0.01 and CI_c 不跨 0 → 该组件有贡献
    任一组件无贡献仍声称"整合带来提升" → R5 回退
    全部组件无贡献 → 硬阻断(循环论证)
  stage_tag: integration
- decidable: auto
  id: V4MODAL
  inputs:
  - in_silico
  - independent_direction
  - in_vitro
  - in_vivo
  - clinical
  - claim
  invariants:
  - V4 原只做主张-证据形式匹配,**无跨模态强度阶梯** —— 本条补上(Lage-Rupprecht 药物重定位)
  - 铁律:**不得跨级主张**。in silico + in vitro 不等于治疗有效,只能说细胞模型中有活性
  - ★词表必须**互斥**(每词只归属一个等级):初版 L1/L2 上限均含候选,导致 L1 达成却声称候选被误判跨级到 L2 —— v2.20 修正
  na_when: 非跨模态验证研究 → N/A + 理由;未报告任何模态证据 → 判不了
  name: 跨模态验证强度分级(不得跨级主张)
  on_fail:
    action: R5 措辞越界
    blocking: false
  pass_when: 声称等级 <= 达成等级
  predicate: "阶梯:L1 in silico → L2 独立数据方向一致 → L3a in vitro\n      → L3b in vivo →\
    \ L4 clinical\n\n判定:声称所需等级 > 实际达成等级 → 跨级主张,不通过\n\nL1 允许候选/预测;L2 允许方向一致;L3a 允许细胞模型中;\n\
    L3b 允许动物模型中;L4 才允许临床效用/治疗有效\n"
  requires_tools: []
  stage_tag: validation
  version: 2.20+
- decidable: auto
  id: T37
  inputs:
  - criteria_dist
  - criteria_total
  name: 判据体系的骨架/休眠比例(L2 消融的判定层)
  note: |
    ★ v2.23 补最后一层:v2.22 产出了 criteria_dist(体温表),但**没有
      一条判据来读这张表并下诊断** —— 骨架/休眠比例可以自我声明,
      无独立检查。这是第 11 条陷阱在**判据层**的残留形态:不是
      "守卫从未 FAIL",而是"判据层结构健康度无独立检查"。
    ★ 判定项来源:T37 的判定项由 ablation.py 产生(不在 verify_all 的
      ledger 里),因为它的输入 criteria_dist 恰由 verify_all 生成 ——
      若在 verify_all 内实现,统计自己的分布会改变分布(自指)。
      故由下游 ablation.py 判定,与"附录由 gen_appendix 生成"同构。
  on_fail:
    action: 判"判据膨胀",新增判据须先论证必要性
    blocking: true
  na_when: 无(每次主验证运行均须判定,不接受 N/A)
  pass_when: 休眠率 == 0 且 GLOBAL 占比 < 10% 且无垄断判据
  predicate: |
    休眠率 = 休眠判据数 / 判据总数
    休眠判据 := n_direct == 0 且 n_branch == 0(从未被任何判定项归因)

    三态(与 H-2 双阈值同构,不是二值):
      休眠率 == 0        → pass
      0 < 休眠率 < 20%   → warn(须逐条声明休眠原因)
      休眠率 >= 20%      → fail(判"判据膨胀")
    附加:
      GLOBAL 占比 >= 10%            → warn(归因稀释)
      单条判据 n_direct/总判定项 > 40% → warn(垄断)
  invariants:
  - 判据层的健康度必须由独立判据判定,不得自我声明
  - 三态判定 pass/warn/fail,禁止压缩为二值(与 H-2 双阈值同构)
  - ★ 自指口径:T37 自身**排除**在休眠统计外(分子分母均排除)。
      与既有自指处理同规:report_guard 不计入自身合法集、链文件不登记
      自身 sha256、MANIFEST 不写自身哈希。若把自己算进去,等于
      "T37 用自己给自己打的分数判定自己" —— 正是框架要防的自证。
      "消融是否在流程里"由 build STAGES 的 rc 保证,不由 T37 兜底。
  requires_tools:
  - ablation
  stage_tag: meta
  version: 2.23+

invariants:
- 硬阻断9条
- R1-R6 定义
- 措辞硬规则
- 禁止 LLM 生成数字:所有数字必须来自脚本输出
- 禁止软化判定:不得把'不通过'说成'部分通过'
- ack=null 不算交接完成
tools:
  pdf_forensics:
    backends:
      poppler:
        authoritative: true
        commands:
        - pdffonts
        - pdftotext
        - pdfimages
        - pdfinfo
      pypdf_recursive:
        authoritative: false
        known_blind_spots:
        - 'encrypted: pypdf 抛 PdfReadError —— 严禁 except 吞掉后判合规(假通过)'
        - 'xref_stream: 跨引用表流解析偶发失败,poppler 更稳健'
        - 'cidfont_no_tounicode: extract_text() 返回空 → 误判''无文本层''(假不通过)'
        - 'xfa: XFA 表单内图像/字体,pypdf 递归不覆盖'
        module: pypdf
        must_annotate: 'detection_backend: pypdf'
        on_blind_spot: 判'判不了'(blocking),不得降级为通过 —— 与 on_unavailable 同规
    on_unavailable: fail_with_reason
    output_schema:
      blocking_level: int
      detection_backend: str
      evidence:
      - str
      expected: any
      observed: any
      passed: bool
    priority:
    - poppler
    - pypdf_recursive
    - fail
    require_raw_stdout: true
version: 1.8+
