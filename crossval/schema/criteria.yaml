conflict_resolution: S21 > S15-C > A2C
criteria:
- decidable: auto
  id: T01
  inputs:
  - data_matrix
  - scale_declaration
  - test_family
  name: 尺度声明与检验家族
  note: 家族须含终点数/亚组数/模型数/分子数四类(S21-A §4)
  on_fail:
    action: V3否决
    blocking: true
  pass_when: true
  predicate: scale_declared(data_matrix) and family_declared(test_family)
  requires_tools:
  - scale_check
  stage_tag: deg
  version: 1.8+
- decidable: auto
  id: T03
  inputs:
  - pvalues
  - declared_family
  - correction_method
  name: 多重检验校正范围
  on_fail:
    action: V3否决
    blocking: true
  pass_when: true
  predicate: correction_matches(pvalues, declared_family, correction_method)
  requires_tools:
  - bh_correct
  - bonferroni
  stage_tag: enrichment
  version: 1.8+
- decidable: hybrid
  id: T06
  inputs:
  - time
  - event
  - competing_events
  - exposure_def
  - method_choice
  judge_rubric: 人工判定:①是否声明竞争风险处理方式(Cause-specific vs Fine-Gray 二选一并预注册)?②是否评估 immortal time bias(landmark
    或时间依赖协变量)?③cox.zph 不满足时是否改用 RMST?④中位随访与 at-risk 表是否报告?缺①在老年/肿瘤/心血管队列中直接不通过。
  name: 时间-事件分析(含竞争风险与时间偏倚)
  note: S21-A §1/§2。竞争事件>10% 强制处理;CSH/Fine-Gray 须二选一预注册
  on_fail:
    action: T06不通过
    blocking: true
  pass_when: true
  predicate: 'competing_declared(competing_events)

    and (prop_competing <= 0.10 or competing_handled(method_choice))

    and (not exposure_requires_survival(exposure_def) or landmark_or_tdcov_used())

    '
  requires_tools:
  - cif_estimator
  - km_estimator
  - cox_ph_test
  stage_tag: survival
  version: 1.8+
- decidable: hybrid
  id: T08
  inputs:
  - missing_prop
  - mechanism
  - sensitivity_done
  judge_rubric: 人工判定:①缺失机制判断(MCAR/MAR/MNAR)是否有依据?②插补模型是否含结局变量?③是否报告了缺失比例与模式?④MNAR 是否做了 tipping point /
    delta 调整?缺②直接不通过。
  name: 缺失数据处理(含 MNAR)
  note: S21-A §5。MNAR 为默认情形,须 tipping point / pattern-mixture / reference-based
  on_fail:
    action: T08不通过
    blocking: true
  pass_when: true
  predicate: '(missing_prop <= 0.05) or sensitivity_done

    and (missing_prop <= 0.20 or tipping_point_reported)

    '
  requires_tools:
  - missingness_report
  stage_tag: imputation
  version: 1.8+
- decidable: auto
  id: T09
  inputs:
  - p_pred
  - source
  name: 预测概率来源声明
  note: S21-C §4。禁止用样本内概率做性能评估
  on_fail:
    action: T09不通过
    blocking: true
  pass_when: true
  predicate: source_declared(p_pred) and source != 'insample'
  requires_tools: []
  stage_tag: prediction
  version: 1.8+
- decidable: auto
  id: T12
  inputs:
  - acc_insample
  - auc_outsample
  name: 过拟合警示
  on_fail:
    action: 强制标注过拟合警示
    blocking: false
  pass_when: true
  predicate: not (acc_insample > 0.95 and (acc_insample - auc_outsample) > 0.05)
  requires_tools: []
  stage_tag: performance
  version: 1.8+
- aliases:
  - T13(a)
  - T13a
  decidable: auto
  id: T13a
  inputs:
  - auc_base_ci
  - auc_full_ci
  - dAUC_ci
  name: 临床增量
  on_fail:
    action: F3
    blocking: true
  pass_when: true
  predicate: dAUC >= 0.05 and ci_lower(dAUC) > 0
  requires_tools:
  - bootstrap
  - roc_auc
  version: 1.8+
- decidable: auto
  id: T13b
  inputs:
  - y_true
  - p_pred_cv
  - n_boot
  invariants:
  - 必须使用 CV 预测概率;训练内拟合斜率恒等于 1(数学必然)
  model_family_caveat: '"恒等于 1" 仅对**未正则化 logistic** 成立(MLE 一阶条件); ridge / lasso / EN 与 RF / GBM / SVM
    不恒成立,但同样系统性乐观。 故**所有模型族**均须用 CV 预测概率。脚本分支 3 用未正则化 logistic, 验证的是"恒等于 1"的下界 —— 可接受,条文须写明此限定。'
  name: 校准判据
  on_fail:
    action: F3 + 不得用于个体风险预测
    blocking: true
  pass_when: true
  predicate: ci_covers(calibration_slope_bootstrap(y_true, p_pred_cv, n_boot), 1.0)
  requires_tools:
  - bootstrap
  - logistic_fit
  small_sample_extension:
    rationale: 'TL-BEE 实测:n=5~50 时,用 importance sampling + control variates 借源域

      信息后,误差估计的 MSE 显著低于传统估计器。但相关度若事后调参,

      等于把结论塞进先验 —— 故必须预注册。

      '
    required:
    - 必须声明是否使用源域信息(迁移学习 / 先验 / 数据增强)
    - 若使用,必须报告源域-目标域**相关度系数** |alpha| 及其确定方法
    - 若 |alpha| 系"看着结果调出来的" → R3 回退
    trigger: 目标域 n < 50
  version: 1.8+
- aliases:
  - T13(c)
  - T13c
  blocking_threshold: 12
  clinical_magnitude: 胜出率高≠临床有意义;中位|ΔNB|<0.01 视为无临床意义
  decidable: auto
  deprecated_indicators:
  - 最优子区间胜出率与落差 —— O(n^2) 候选下几乎必然≈1.0,等价于 1-win_rate_full,无独立判别力
  grey_zone: 8 < neg_run < 12 → 判'不确定',不得判通过
  id: T13c
  inputs:
  - y_true
  - p_candidate
  - p_baseline
  - preregistered_range
  must_report:
  - 'net_benefit_diff_median_abs: 预注册区间内 |NB差| 中位数(强制)'
  - 'net_benefit_diff_min: 预注册区间内 NB 差最小值(强制)'
  name: 决策意义(DCA)
  on_fail:
    action: F3
    blocking: true
  pass_when: verdict == True
  predicate: '# v1.6:判定式必须引用 warning/blocking 阈值,禁止硬编码 10 点单阈值。

    # v1.6 前为硬编码单阈值(neg_run 对 10 取小于),与 warning=8/blocking=12 矛盾,已废。

    win_rate_full <- mean(nb_diff(y_true, p_candidate, p_baseline, grid) > 0)

    neg_run <- max_consecutive_negative(nb_diff, preregistered_range)

    if neg_run >= blocking_threshold:   verdict <- F3

    elif neg_run >= warning_threshold:  verdict <- ''不确定''   # 灰区,不得判通过

    else: verdict <- (win_rate_full >= 0.5)

    verdict

    '
  requires_tools:
  - net_benefit
  - curve_shape
  stage_tag: dca
  threshold_note: 连续负 ≥10 点为默认,无临床推导依据;填槽阶段按场景定死 (卒中 0.15-0.35 / 筛查 0.05-0.20)。建议双阈值 8 点警告 / 12 点阻断, 中间判不确定
    —— 已校准模型实测 8 点,单阈值余量仅 2。
  threshold_note_struct: 10 点为默认单阈值,无临床推导依据;上列双阈值自 v1.6 起生效。 已校准模型实测 8 点,单阈值余量仅 2 —— 边界情形(9-11 点)既漏检又误伤。
  version: 1.8+
  warning_threshold: 8
- decidable: auto
  id: T14
  inputs:
  - est_discovery_ci
  - est_replication_ci
  - I2
  - power_replication
  k2_caveat: k=2 时 I2 的 df=1、Q 期望=1,随机波动即可接近 50% —— 不得作唯一判据
  merge_aux_criteria:
  - A 事件率差异 < 15%(独立判据)
  - B 方向一致(效应同号)
  - C 终点定义等价性 —— 一票否决
  - I2 > 50% 强制报告异质性来源;> 75% 禁合并主分析
  method_layer:
    claim_ceiling:
      从头训练: 不得声称"跨数据集复现"(那只是独立建模)
      微调(n_calib>=20): 在该 SOP 下可复用
      零样本迁移: 在目标数据上方向一致
    enforcement: T14 与 T27 是**同一次复现判定的两面**,缺 T27 则 T14 无效
    predicate: T27 的迁移策略声明必须同时满足(T14 结果层 AND T27 方法层)
    rationale: '一个在目标数据上调过参的模型,两个 CI 当然会重叠 —— 那不是泛化,是泄漏。

      故 T14 不得单独通过:必须与 T27 配对判定。

      '
    required: true
  name: 复现判定
  on_fail:
    action: R5
    blocking: false
  pass_when: verdict == True
  predicate: "if power_replication < 0.8:\n    verdict <- \"不确定(复现集功效不足)\"     # S21-A §3.6:区分\"没复现\"\
    与\"没能力复现\"\nelse:\n    verdict <- same_direction and ci_overlap and (I2 <= 50)\n"
  requires_tools:
  - heterogeneity
  - power_calc
  stage_tag: replication
  version: 1.8+
- decidable: auto
  id: T15
  inputs:
  - assay_type
  - mito_pct
  - thresholds
  name: 单细胞 QC 阈值
  note: 核/单核 mito% 分布不同,单阈值跨类型套用双向失效
  on_fail:
    action: T15不通过
    blocking: false
  pass_when: true
  predicate: thresholds_stratified_by_assay_type(assay_type, thresholds)
  requires_tools:
  - qc_summary
  stage_tag: qc
  version: 1.8+
  wording_fix: 单核 RNA 为**另行设定更严阈值 <5%**,非放宽(旧文写放宽至 <5%,措辞误导)
  wording_rationale: 核 RNA 线粒体含量本就低,照抄胞质 RNA 的 <15% 会把目标细胞滤光
- decidable: hybrid
  id: T16
  inputs:
  - counts
  - donor_id
  - celltype
  - n_cells_per_unit
  - annotation_method
  - composition_method
  judge_rubric: 人工判定:①推断单位是否为 donor/患者(非细胞)?②每 (donor,celltype) 细胞数是否达标?③稀有类型是否走了'合并相近类型'路径?④是否用 pseudobulk?
  name: 单细胞推断单位与组成
  on_fail:
    action: 硬阻断(伪重复)
    blocking: true
  pass_when: true
  predicate: 'inference_unit == "donor"

    and all(n_cells_per_unit >= 10 or excluded)

    and annotation_method_preregistered

    and (composition_question == False or composition_method_preregistered)

    '
  rare_celltype_path: 第三条路径:稀有类型在多 donor 上均不足 10 细胞时,允许合并相近细胞类型后做 pseudobulk(须预注册合并方案并声明)
  rare_celltype_rationale: 仅有排除一条路径会系统性滤掉 Treg、浆细胞等稀有类型,反而掩盖真实信号
  requires_tools:
  - pseudobulk
  - rank_test
  stage_tag: deg
  version: 1.8+
- decidable: auto
  id: T17
  inputs:
  - perturbation_method
  - edge_distribution_preserved
  invariants:
  - 倍数扰动不改变与结局的关联,无对照价值,且改变尺度引入混淆
  - 计算扰动不构成功能验证
  name: 计算扰动
  on_fail:
    action: T17不通过
    blocking: false
  pass_when: true
  predicate: perturbation_method in ['quantile','permutation']
  requires_tools: []
  stage_tag: perturbation
  version: 1.8+
- decidable: auto
  id: T18
  inputs:
  - results_all_variants
  - preregistered_variants
  name: 敏感性分析
  note: 程序定义已移出必做项,改立 B03-A(S15-C §4)
  on_fail:
    action: 硬阻断(选择性报告)
    blocking: true
  pass_when: true
  predicate: reported_all(results_all_variants, preregistered_variants)
  requires_tools: []
  stage_tag: sensitivity
  version: 1.8+
- decidable: hybrid
  id: Y6
  inputs:
  - batch_structure
  - coupling_diagnosis
  - method_preregistered
  judge_rubric: 人工判定:①批次与生物学条件是否耦合?(耦合→禁止当协变量回归、禁止盲用 ComBat)②若未耦合,整合方法(ComBat/Harmony/scVI/rliger)是否预注册?③批次校正后是否仍宣称'独立复现'?④校正前后是否都做了可视化对比?
  name: 批次整合
  note: S21-B §1。批次校正后的内部子集不得称'独立验证集'
  on_fail:
    action: R3回退 或 硬阻断
    blocking: true
  pass_when: true
  predicate: 'batch_structure_documented

    and (not fully_coupled or no_correction_applied)

    and method_preregistered

    '
  requires_tools: []
  stage_tag: batch
  version: 1.8+
- aliases:
  - B01-A
  - B01A
  decidable: auto
  id: B01A
  inputs:
  - n_events
  - n_candidates
  - alpha
  - power
  - MDE
  name: 功效与样本量论证
  on_fail:
    action: B02不得启动
    blocking: true
  pass_when: true
  predicate: 'EPV <- n_events / n_candidates

    (EPV >= 10) or (regularization_applied) or (EPV >= 5 and dimension_reduced)

    '
  requires_tools:
  - epv_calc
  - power_calc
  version: 1.8+
- aliases:
  - B02-S
  - B02S
  decidable: auto
  id: B02S
  inputs:
  - independent_ok
  - outcome_available
  - epv
  - missing_key_prop
  name: 可行性判定(止损出口)
  note: INFEASIBLE 是合法且受尊重的结论,禁止为规避而硬判
  on_fail:
    action: 'INFEASIBLE: 停止并输出限制与补救建议'
    blocking: true
  pass_when: state in ['FEASIBLE','FEASIBLE_WITH_DOWNGRADE']
  predicate: feasibility_gate(...)
  requires_tools: []
  version: 1.8+
- aliases:
  - B03-A
  - B03A
  decidable: hybrid
  id: B03A
  inputs:
  - candidate_definitions
  - effect_per_definition
  - selection_rationale
  judge_rubric: 人工判定:①程序定义变体是否为成员集层面的实质变更(Jaccard ≤ 0.5,排除纯权重缩放与部分归零)?②是否在分析前冻结并留痕?③是否只做了权重缩放(橡皮图章)?④报告的是否为全部变体(含不显著的)?
  name: 程序/签名定义论证
  on_fail:
    action: 不得冻结
    blocking: true
  overlap_evidence: 实测 相对重叠 32.5% vs Jaccard 19.4% —— 两口径不等,条文须指定
  overlap_metric: Jaccard = |A∩B|/|A∪B| —— 非相对重叠 |A∩B|/|A|
  overlap_threshold: Jaccard <= 0.5
  pass_when: true
  predicate: 'len(candidate_definitions) >= 2

    and variants_are_member_set_changes      # 禁仅权重缩放(S15-C §4.2.3)

    and rationale_not_based_on_effect_size

    '
  requires_tools: []
  substantive_change: '|supp(W) △ supp(W'')| / |supp(W) ∪ supp(W'')| >= 0.5,排除部分归零中间态'
  version: 1.8+
- decidable: auto
  id: V5DECL
  inputs:
  - manuscript_sections
  items:
  - 伦理批准
  - 知情同意
  - 数据共享
  - 代码共享
  - AI使用披露
  - 利益冲突
  - 作者贡献
  - 资助
  - 注册号
  - 报告规范声明
  name: 声明与披露清单
  on_fail:
    action: V5不通过,不得投稿
    blocking: true
  pass_when: true
  predicate: all_declared(manuscript_sections, 10_items)
  requires_tools:
  - section_scan
  version: 1.8+
- decidable: hybrid
  id: T19
  inputs:
  - 空间坐标矩阵
  - 注释结果
  judge_rubric: 人工判定:①推断单位是 spot 还是细胞——必须全文一致,禁止混用;②去卷积方法是否预注册且参考集来源声明;③是否报告空间自相关(Moran's I 等),未检验而直接做差异=伪重复;④邻域分析是否声明邻域定义(半径/KNN)。缺①或③直接不通过。
  name: 空间转录组(10x Visium/Xenium/CosMx)
  on_fail: R6 硬阻断(伪重复)
  predicate: 空间项目须声明:①推断单位(spot / 细胞);②去卷积方法(cell2location/RCTD);③空间自相关是否检验;④邻域分析方法
  stage_tag: spatial
- decidable: hybrid
  id: T20
  inputs:
  - 稿件
  - 目标期刊 Guide
  judge_rubric: 人工判定:①是否选定适用的报告规范(预测模型→TRIPOD;观察性→STROBE;肿瘤标志物→REMARK);②是否产出逐条对照表;③未覆盖条目是否给出理由;④声明块(伦理/知情同意/数据共享/代码共享/AI使用/利益冲突/作者贡献)是否齐全。缺②直接不通过。
  name: 报告规范对照(TRIPOD/STROBE/REMARK)
  on_fail: 退回补充对照表
  predicate: 投稿前须逐条对照目标报告规范,缺项须声明理由或补充;不得声称'已符合'而无对照表
  stage_tag: reporting
- decidable: auto
  id: WP-1
  name: 标题不越界
  note: 守卫 writing_guard.py;变异用例:加'揭示'→ FAIL
  on_fail: F3
  predicate: 标题不含升级词/无信息词, 字数合规, 含对象+发现
  stage_tag: writing
- decidable: auto
  id: WP-2
  name: 摘要首句为 P1
  note: NC-6;与 WP-6.1 构成'同一真相两处一致'的对称守卫
  on_fail: F3
  predicate: 摘要首句 == P1 且四段齐全, 末句含边界, 含样本量
  stage_tag: writing
- decidable: auto
  id: WP-3
  name: 背景文献可核验
  note: 第三态:返 0 篇判 N/A, 不降级为 AI 生成
  on_fail: F3
  predicate: 引言引用 ∈ research_survey_skill 输出;skill 返 0 篇 → N/A
  stage_tag: writing
- decidable: auto
  id: WP-4
  name: 材料方法可复现
  note: 版本/批号;预注册偏差声明;统计含单双侧+校正;伦理;数据共享;power 依据
  on_fail: F3
  predicate: 每步带版本或批号;预注册偏离已声明;含 单侧/双侧 + BH|Bonferroni|FDR;数据共享登录号
  stage_tag: writing
- decidable: auto
  id: WP-5a
  name: 结果文字有台账锚
  note: v2.15 修:窗口由固定 50 字符改为同句内(跨句曾致误判)
  on_fail: F3
  predicate: 每个'显著'**同句内**有 [L-xxx];不含机制词;阴性显式
  stage_tag: writing
- decidable: auto
  id: WP-5c
  name: 图注必含项
  note: 对齐作图规范 §D
  on_fail: F3
  predicate: 图注含精确 n / 误差棒+中心 / 检验方法;≤250 字
  stage_tag: writing
- decidable: auto
  id: WP-5b
  name: 图表排版
  note: 图号连续/先引用后出现/引用距离 ≤3 段/多面板 a,b,c
  on_fail: F3
  predicate: 图号连续无缺;先引用后出现;图与引用段落 ≤3 段
  stage_tag: writing
- decidable: auto
  id: WP-5d
  name: 图表标题
