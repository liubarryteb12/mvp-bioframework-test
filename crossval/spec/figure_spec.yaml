# 作图规范 v1.0 —— 机器可检部分(依据:用户提供的 A–D 条文)
# 仅收录**可机械判定**的条目;Nature 官方措辞类条目见 作图规范_v1.0.md 并标注"需人工核对原文"。
version: "1.0"

# ---------- A-7 色板 ----------
palettes:
  wong2011:            # Nature Methods 8:441 (2011) Bang Wong
    - "#000000"
    - "#E69F00"
    - "#56B4E9"
    - "#009E73"
    - "#F0E442"
    - "#0072B2"
    - "#D55E00"
    - "#CC79A7"
  okabe_ito:
    - "#000000"
    - "#E69F00"
    - "#56B4E9"
    - "#009E73"
    - "#F0E442"
    - "#0072B2"
    - "#D55E00"
    - "#CC79A7"

sequential_safe:        # 连续数据
  - viridis
  - cividis
  - plasma
  - magma
  - inferno

forbidden:              # A-7 禁止
  rainbow: [jet, rainbow, hsv, nipy_spectral, gist_rainbow]
  red_green_pair: true  # 红绿对比
  cmap_names: [jet, rainbow, hsv, nipy_spectral, gist_rainbow, spectral]

colorblind:
  simulate: [protanopia, deuteranopia, tritanopia]
  min_delta_e: 10.0     # CIELAB 距离下限(protan/deutan 强制)
  tritanopia_advisory: 8.0   # 建议级:Wong 色板不保证三色盲安全(实测 8.65)
  # ⚠ 实测:ΔE 抓不到"纯红/纯绿"(亮度差 0.50,模拟后仍可分)。
  #   真正的风险是等亮度红绿 → 由 C-6.c3 单独检查。
  redgreen:
    hue_gap_deg: [80, 160]
    max_lum_diff: 0.15

# ---------- A-1 分辨率 ----------
dpi:
  photo_min: 300        # 照片/连续色调
  line_min: 600         # 线条图
  mixed_min: 600
  raster_target: 600
  preview_target: 300

# ---------- A-3 / §5.8 格式 ----------
formats:
  required: [pdf, tiff, png, jpg]
  vector_main: [pdf, eps]        # 矢量主图
  raster_main: [tiff]            # 光栅主图
  forbidden_as_main: [jpg, jpeg] # Nature 明文:JPEG 不得作主图生产文件
  png_role: preview              # 仅预览
  max_bytes:
    main: 52428800               # 50 MB
    extended_data: 10485760      # 10 MB

# ---------- A-2 色彩模式 ----------
color_mode:
  original_research: RGB
  review: CMYK

# ---------- A-5 尺寸（2026-09-14 对齐 09/02 出图要求：安全规格取各刊范围小值）----------
size:
  single_col_max_mm: 85     # 各家 85–90，取 85 最安全
  double_col_max_mm: 170    # 各家 170–190，取 170 最安全
  height_max_mm: 170
  linewidth_pt: [0.25, 1.0]
  fontsize_pt: [6, 8]       # 正文文字 6–8pt、刻度 ≥6pt（分图标签 8pt 见 panel_label_pt）
  panel_label_pt: 8

# ---------- A-6 禁止项 ----------
forbidden_elements:
  - background_grid
  - drop_shadow
  - pattern_fill
  - decorative_icon

# ---------- §5.7 命名 ----------
naming:
  pattern: '^\d{2}_[a-z][a-z0-9]*_[a-z0-9_]+\.(pdf|eps|tiff|tif|png|jpg|jpeg)$'
  example: "02_deg_volcano.pdf"
  # analysis_step 必须属于框架阶段标签(见 G-7)
  step_must_match_framework: true

# ---------- B / D 图注必含项 ----------
legend:
  error_bar_required: ["SD", "SEM", "95% CI", "CI"]      # B-1
  center_required: ["mean", "median"]                     # B-1
  n_pattern: '\bn\s*=\s*\d+\b'                            # B-2 精确整数
  n_forbid_range: '\bn\s*=\s*\d+\s*[-–—]\s*\d+'           # 禁止 n=3-6
  replicate_unit_required:                                 # B-2 单位
    - "biologically independent"
    - "independent experiment"
    - "independent sample"
    - "animals"
    - "donor"
    - "patients"
    - "cells"
    - "独立"
  test_required:                                           # B-3
    - "test"
    - "检验"
  sided_required: ["two-sided", "two-tailed", "one-sided", "one-tailed", "双侧", "单侧"]
  correction_keywords:
    - "correction"
    - "corrected"
    - "BH"
    - "FDR"
    - "Bonferroni"
    - "校正"
  boxplot_required:                                        # B-5
    - ["minima|minimum|min", "最小值"]
    - ["maxima|maximum|max", "最大值"]
    - ["centre|center|median", "中线"]
    - ["bounds|box|Q1|quartile", "箱体边界"]
    - ["whisker", "须"]
    - ["percentile", "百分位"]
  max_words_nature: 250                                    # D-3
  forbid_method_narration: true                            # D-4
